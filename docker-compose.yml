version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: divinecorner-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: divinecorner
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: divinecorner_user
      MYSQL_PASSWORD: divine123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: divinecorner-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: divinecorner-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/divinecorner?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: divinecorner_user
      SPRING_DATASOURCE_PASSWORD: divine123

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # JWT
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production-min-256-bits
      JWT_EXPIRATION: 86400000

      # File upload
      FILE_UPLOAD_DIR: /app/uploads
      APP_BASE_URL: http://localhost:8080/api

      # Profile
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql-data:
  redis-data:
  uploads-data:
